  /control/availability:
    get:
      operationId: getParkingAvailability
      summary: Obtiene la disponibilidad actual de los estacionamientos de todas las sedes.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Devuelve el estado inicial que renderiza el frontend al abrir la pantalla de
        disponibilidad. La ocupación no se almacena: se calcula contando los records de
        permanencia sin fecha de salida de cada sede, y la disponibilidad es la capacidad de la
        sede menos esa ocupación, nunca menor a cero.

        Una vez obtenido este estado inicial, los cambios posteriores llegan por WebSocket en
        `/control/availability/ws`, cuyos eventos usan el esquema `LocationAvailability`. El
        WebSocket no reemplaza a esta operación: la complementa.

        ### Data de Prueba
        No aplica.
      tags:
        - Access Control Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
      responses:
        '200':
          description: Disponibilidad actual de cada sede.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingAvailabilityList'
        '401':
          description: No está autorizado para consumir el API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '500':
          description: Ocurrió un error inesperado. Por favor contactarse con Soporte T&eacute;cnico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '503':
          description: El servicio no se encuentra disponible. Por favor reintente más tarde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '504':
          description: Se superó el tiempo de respuesta interna.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
  /control/availability/{locationId}:
    get:
      operationId: getLocationAvailability
      summary: Obtiene la disponibilidad actual del estacionamiento de una sede.
