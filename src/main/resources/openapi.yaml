          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '403':
          description: El usuario autenticado no tiene el rol ROLE_SAE, o no es el aceptante asignado a la solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '404':
