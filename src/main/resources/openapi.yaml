  /vehicles/me:
    get:
      operationId: getMyVehicles
      summary: Obtiene los vehículos registrados por el usuario autenticado.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Devuelve los vehículos que el usuario autenticado tiene asignados, junto con la cantidad de vehículos asignados y el máximo permitido. Los vehículos desasignados ya no pertenecen a ningún usuario y no se incluyen. El propietario se determina a partir del usuario autenticado, no del cuerpo ni de la ruta de la petición.

        ### Data de Prueba
        No aplica.
      tags:
        - Vehicle Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
      responses:
        '200':
          description: Listado de vehículos del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailList'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
