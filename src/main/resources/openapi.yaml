  /request/authorization/{numberPlate}:
    get:
      operationId: getParkingAuthorization
      summary: Consulta si la placa indicada cuenta con autorización vigente de estacionamiento.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Resuelve, a partir de una placa, el vehículo y su autorización de ingreso al estacionamiento
        en el ciclo actual. Es el contrato que consume `business-parking-control` para validar el
        ingreso físico de un vehículo, de modo que el control de acceso no necesite conocer las
        tablas de vehículos ni de solicitudes.

        La operación siempre responde `200` cuando la consulta se pudo resolver: el campo `result`
        indica el motivo de negocio cuando `authorized` es `false`. `idVehicle` se devuelve siempre
        que la placa exista, incluso si no está autorizada, porque el control de acceso lo necesita
        para registrar la salida de un vehículo cuya autorización ya venció.

        ### Data de Prueba
        No aplica.
      tags:
        - Request Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
        - name: numberPlate
          in: path
          description: Placa del vehículo.
          required: true
          schema:
            type: string
            example: ABC-123
      responses:
        '200':
          description: Resultado de la validación de autorización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingAuthorization'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '401':
          description: No está autorizado para consumir el API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '403':
          description: El usuario autenticado no tiene el rol ROLE_SECURITY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '500':
