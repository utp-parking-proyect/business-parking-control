  /request:
    post:
      operationId: createParkingRequest
      summary: Registra solicitudes de ingreso a estacionamiento de la UTP.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Esta API recibe la solicitud para la creación de una solicitud de ingreso al estacionamiento, enviadas por los canales web y móvil. El solicitante se determina a partir del usuario autenticado, no del cuerpo de la petición.

        Si la placa corresponde a un vehículo ya registrado por el usuario, se reutiliza ese vehículo; si no existe, se registra respetando el máximo de vehículos permitido. No se admiten vehículos desasignados ni solicitantes que hayan alcanzado el máximo de solicitudes del ciclo.

        ### Data de Prueba
        No aplica.
      tags:
        - Request Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
      requestBody:
        description: Entrada del Servicio.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingRequestIn'
        required: true
      responses:
        '201':
          description: Proceso de Registro Satisfactorio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingRequestOut'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '401':
          description: No está autorizado para consumir el API
          content:
