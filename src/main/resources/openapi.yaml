  /control/entry:
    post:
      operationId: registerParkingEntry
      summary: Registra el ingreso de un vehículo al estacionamiento de una sede.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Valida y registra el ingreso físico de un vehículo. Personal de Seguridad indica la placa y
        la sede donde se encuentra la puerta. El servicio valida, en este orden, que el vehículo
        exista, que esté asignado a un usuario, que cuente con autorización vigente, que no se
        encuentre ya dentro de un estacionamiento y que la sede tenga espacios disponibles.

        Cuando el ingreso es autorizado se crea un record de permanencia con la fecha de ingreso y
        el usuario de Seguridad que lo registró, y se publica la nueva disponibilidad de la sede a
        los clientes conectados por WebSocket.

        Las validaciones de negocio no se devuelven como error: la operación responde `200` con
        `authorized` en `false` y el motivo en `result`, para que la interfaz de la puerta muestre
        siempre una respuesta accionable.

        ### Data de Prueba
        No aplica.
      tags:
        - Access Control Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
      requestBody:
        description: Entrada del Servicio.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlIn'
        required: true
      responses:
        '200':
          description: Resultado del intento de ingreso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlOut'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '401':
          description: No está autorizado para consumir el API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '403':
          description: El usuario autenticado no tiene el rol ROLE_SECURITY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '404':
          description: La sede indicada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '500':
          description: Ocurrió un error inesperado. Por favor contactarse con Soporte T&eacute;cnico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '503':
          description: El servicio no se encuentra disponible. Por favor reintente más tarde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '504':
          description: Se superó el tiempo de respuesta interna.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
  /control/exit:
    post:
      operationId: registerParkingExit
      summary: Registra la salida de un vehículo del estacionamiento de una sede.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Cierra el record de permanencia abierto del vehículo indicado registrando su fecha de
        salida, y publica la nueva disponibilidad de la sede por WebSocket.

        La salida no exige autorización vigente: un vehículo que ya se encuentra dentro siempre
        debe poder salir. Si el vehículo no tiene un record abierto, o su record abierto pertenece
        a otra sede, la operación responde `200` con `authorized` en `false` y el motivo en
        `result`.

        ### Data de Prueba
        No aplica.
      tags:
        - Access Control Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
      requestBody:
