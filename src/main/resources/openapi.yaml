      description: |-
        ### Acerca de la funcionalidad expuesta
        Devuelve las solicitudes de desasignación del usuario autenticado con su estado y su historial de workflow, para que pueda conocer cuáles están en revisión y el motivo de las que fueron rechazadas.

        ### Data de Prueba
