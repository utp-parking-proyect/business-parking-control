  /request/{requestId}:
    get:
      operationId: getParkingRequestById
      summary: Obtiene el detalle de una solicitud de ingreso a estacionamiento de la UTP.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Devuelve la información de una solicitud junto con su historial de workflow. Cada entrada del historial incluye la observación registrada en ese cambio de estado, que es donde queda el motivo del rechazo o el comentario de aprobación del Personal SAE. Solo pueden consultarla el solicitante propietario del vehículo y el Personal SAE asignado como aceptante.

        ### Data de Prueba
        No aplica.
      tags:
        - Request Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
        - name: requestId
          in: path
          description: ID de la solicitud.
          required: true
          schema:
            type: integer
            example: 1
