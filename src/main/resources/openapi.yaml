        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
        - name: acceptorId
          in: path
          description: ID del aceptante.
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Listado de solicitudes de estacionamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingRequestInformationList'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '401':
          description: No está autorizado para consumir el API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '403':
          description: No tiene los permisos necesarios para ejecutar esta operacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '404':
          description: El recurso solicitado no fue encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '409':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '500':
          description: Ocurrió un error inesperado. Por favor contactarse con Soporte T&eacute;cnico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '503':
