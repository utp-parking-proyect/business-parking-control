  /vehicles/unassignment-requests/{unassignmentRequestId}:
    patch:
      operationId: respondToVehicleUnassignmentRequest
      summary: Registra la respuesta de Personal SAE a una solicitud de desasignación de vehículo.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Permite que el Personal SAE asignado como aceptante apruebe o rechace la desasignación. Al aprobarla, el vehículo queda en estado UNASSIGNED y sin propietario, conservando intactas sus solicitudes de estacionamiento y su historial. Al rechazarla, el vehículo no se modifica y el motivo del rechazo queda visible para el solicitante.

        ### Data de Prueba
        No aplica.
      tags:
        - Vehicle Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
        - name: unassignmentRequestId
          in: path
          description: ID de la solicitud de desasignación.
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        description: Entrada del Servicio.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingResponseIn'
        required: true
      responses:
        '200':
          description: Proceso de Respuesta Satisfactorio.
          content:
