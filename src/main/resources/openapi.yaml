  /request/{requestId}/resubmit:
    post:
      operationId: resubmitParkingRequest
      summary: Reenvía una solicitud rechazada de ingreso a estacionamiento de la UTP para una nueva revisión.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Permite que el propietario de una solicitud en estado RECHAZADO la reenvíe para una nueva revisión, conservando el mismo identificador de solicitud, vehículo y ciclo. Genera nuevas entradas en el historial de workflow.

        ### Data de Prueba
        No aplica.
      tags:
        - Request Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
        - name: requestId
          in: path
          description: ID de la solicitud a reenviar.
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        description: Entrada del Servicio.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingRequestResubmitIn'
      responses:
        '200':
          description: Proceso de Reingreso Satisfactorio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingRequestOut'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '401':
          description: No está autorizado para consumir el API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '403':
          description: No tiene los permisos necesarios para ejecutar esta operacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '404':
          description: El recurso solicitado no fue encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '409':
          description: La solicitud no se encuentra en un estado válido para ser reenviada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '500':
          description: Ocurrió un error inesperado. Por favor contactarse con Soporte T&eacute;cnico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '503':
          description: El servicio no se encuentra disponible. Por favor reintente más tarde.
