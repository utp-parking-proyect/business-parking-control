  /vehicles:
    post:
      operationId: registerVehicle
      summary: Registra un vehículo para el usuario autenticado.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Registra un vehículo reutilizable que el usuario podrá seleccionar al crear solicitudes de ingreso al estacionamiento. El propietario se determina a partir del usuario autenticado. El vehículo queda en estado ASSIGNED. Un usuario no puede superar el máximo de vehículos asignados; los vehículos desasignados permanecen registrados y no cuentan para ese límite.

        ### Data de Prueba
        No aplica.
      tags:
        - Vehicle Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
      requestBody:
        description: Entrada del Servicio.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleIn'
        required: true
      responses:
        '201':
          description: Proceso de Registro Satisfactorio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetail'
        '400':
          description: Los datos proporcionados no son válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '401':
          description: No está autorizado para consumir el API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '403':
          description: La placa indicada pertenece a otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '409':
          description: El usuario alcanzó el máximo de vehículos asignados o ya tiene registrada la placa indicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiException'
        '500':
