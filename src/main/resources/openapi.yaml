  /vehicles/{vehicleId}/unassignment-requests:
    post:
      operationId: requestVehicleUnassignment
      summary: Solicita la desasignación de un vehículo del usuario autenticado.
      description: |-
        ### Acerca de la funcionalidad expuesta
        Registra una solicitud para que el vehículo deje de pertenecer al usuario. La desasignación no es inmediata: queda sujeta a la revisión de Personal SAE mediante el workflow del proceso VEHICLE_UNASSIGNMENT. Solo el propietario actual puede solicitarla, el vehículo no puede estar ya desasignado y no puede existir otra solicitud abierta para el mismo vehículo.

        ### Data de Prueba
        No aplica.
      tags:
        - Vehicle Controller
      parameters:
        - $ref: '#/components/parameters/Request-ID'
        - $ref: '#/components/parameters/request-date'
        - $ref: '#/components/parameters/app-code'
        - $ref: '#/components/parameters/caller-name'
        - name: vehicleId
          in: path
          description: ID del vehículo.
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        description: Entrada del Servicio.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUnassignmentIn'
        required: true
      responses:
        '201':
          description: Proceso de Registro Satisfactorio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleUnassignmentRequestDetail'
        '400':
          description: Los datos proporcionados no son válidos, o falta el motivo de la desasignación.
          content:
            application/json:
