openapi: 3.0.1
info:
  title: API BS UTP Parking V1
  description: 'Permite registrar las solicitudes de usuarios para contar con el beneficio de usar los estacionamientos de la UTP.'
  version: 1.0.0
servers:
  - url: /utp-parking/v1
externalDocs:
  url: 'https://github.com/utp-parking-proyect'
  description: Organización de Github
tags:
  - name: Request Controller
    description: Parking request data controller¨
  - name: Response Controller
    description: Parking response data controller
  - name: Vehicle Controller
    description: Applicant vehicle data controller
  - name: Access Control Controller
    description: Physical parking access control and availability
paths:
